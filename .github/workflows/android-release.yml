name: Android release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      APK_NAME: magpie-usage-${{ inputs.tag || github.ref_name }}.apk

    steps:
      - name: Check out requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate tag and app version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag must have semantic version form vX.Y.Z."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} does not exist."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$HEAD_SHA" != "$TAG_SHA" ]]; then
            echo "::error::Checked-out commit does not match tag ${RELEASE_TAG}."
            exit 1
          fi
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION_NAME" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Tag ${RELEASE_TAG} requires versionName ${EXPECTED_VERSION}; found ${VERSION_NAME:-missing}."
            exit 1
          fi
          echo "Validated tag ${RELEASE_TAG} against versionName ${VERSION_NAME}."

      - name: Decode keystore, build signed APK, and remove keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"
          KEYSTORE_DIR="$(mktemp -d "$RUNNER_TEMP/magpie-keystore.XXXXXX")"
          # Decode, sign, and delete in one step. The trap covers build
          # failures, cancellation, timeouts, and successful completion.
          trap 'rm -rf -- "$KEYSTORE_DIR"' EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DIR/release.jks"; then
            echo "::error::Signing keystore could not be decoded."
            exit 1
          fi
          chmod 600 "$KEYSTORE_DIR/release.jks"
          test -s "$KEYSTORE_DIR/release.jks"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_DIR/release.jks"
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_PATH" > "$RUNNER_TEMP/magpie-apk-badging.txt"
          APK_VERSION_NAME="$(sed -nE "s/.*versionName='([^']+)'.*/\1/p" "$RUNNER_TEMP/magpie-apk-badging.txt" | head -n 1)"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          if [[ "$APK_VERSION_NAME" != "$EXPECTED_VERSION" ]]; then
            echo "::error::APK versionName is ${APK_VERSION_NAME:-missing}; expected ${EXPECTED_VERSION}."
            exit 1
          fi
          echo "Verified signed APK versionName ${APK_VERSION_NAME}."
          cp "$APK_PATH" "$APK_NAME"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_NAME"
          ARGS=(release create "$RELEASE_TAG" "$APK_NAME" --verify-tag --title "$RELEASE_TAG")
          if [[ -f RELEASE_NOTES.md ]]; then
            ARGS+=(--notes-file RELEASE_NOTES.md)
          else
            ARGS+=(--generate-notes)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh "${ARGS[@]}"
          fi
